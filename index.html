<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="application-name" content="MEMI Tracker">
<meta name="apple-mobile-web-app-title" content="MEMI Tracker">
<meta name="description" content="Remote MEMI Protocol Visual Tracker with offline installable app support.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Remote MEMI Protocol Visual Tracker</title>
<style>
:root {
color-scheme: dark;
--safe-top: env(safe-area-inset-top, 0px);
--safe-right: env(safe-area-inset-right, 0px);
--safe-bottom: env(safe-area-inset-bottom, 0px);
--safe-left: env(safe-area-inset-left, 0px);
}
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}
html,
body {
width: 100%;
height: 100%;
margin: 0;
overflow: hidden;
overscroll-behavior: none;
background: #121212;
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
position: fixed;
inset: 0;
touch-action: manipulation;
user-select: none;
-webkit-user-select: none;
}
#canvas {
position: fixed;
inset: 0;
display: block;
width: 100vw;
height: 100vh;
width: 100dvw;
height: 100dvh;
background: #121212;
touch-action: none;
}
#controls {
position: fixed;
top: calc(12px + var(--safe-top));
left: calc(12px + var(--safe-left));
right: auto;
z-index: 20;
max-width: min(760px, calc(100vw - 24px - var(--safe-left) - var(--safe-right)));
padding: 10px;
border: 1px solid #3b3b3b;
border-radius: 10px;
background: rgba(20, 20, 20, 0.94);
box-shadow: 0 6px 20px rgba(0,0,0,0.35);
display: flex;
gap: 8px;
flex-wrap: wrap;
transition: opacity 160ms ease, transform 160ms ease;
}
#controls.is-hidden {
opacity: 0;
pointer-events: none;
transform: translateY(-8px);
}
button {
min-height: 44px;
border: 1px solid #484848;
border-radius: 7px;
padding: 10px 13px;
background: #262626;
color: #ededed;
font: inherit;
font-size: 13px;
font-weight: 650;
line-height: 1.15;
cursor: pointer;
touch-action: manipulation;
}
button:hover,
button:focus-visible {
background: #383838;
border-color: #6a6a6a;
outline: none;
}
button:active {
transform: translateY(1px);
}
.stop-btn {
background: #7a1111;
border-color: #a51a1a;
}
.stop-btn:hover,
.stop-btn:focus-visible {
background: #a51a1a;
}
.secondary-btn {
background: #1c1c1c;
}
#status {
position: fixed;
left: calc(12px + var(--safe-left));
bottom: calc(12px + var(--safe-bottom));
z-index: 15;
max-width: calc(100vw - 24px - var(--safe-left) - var(--safe-right));
padding: 7px 11px;
border-radius: 6px;
background: rgba(0, 0, 0, 0.68);
color: #b9b9b9;
font-size: 14px;
font-weight: 550;
pointer-events: none;
}
#controlsToggle {
position: fixed;
top: calc(12px + var(--safe-top));
right: calc(12px + var(--safe-right));
z-index: 30;
min-width: 86px;
}
@media (max-width: 720px) {
#controls {
right: calc(12px + var(--safe-right));
max-width: none;
padding-right: 106px;
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
}
#controls button {
width: 100%;
font-size: 12px;
padding: 9px 8px;
}
#status {
font-size: 13px;
text-align: center;
left: calc(8px + var(--safe-left));
right: calc(8px + var(--safe-right));
max-width: none;
}
}
@media (orientation: landscape) and (max-height: 520px) {
#controls {
max-width: calc(100vw - 120px - var(--safe-left) - var(--safe-right));
padding-right: 10px;
grid-template-columns: repeat(3, minmax(0, 1fr));
}
}
@media (prefers-reduced-motion: reduce) {
#controls {
transition: none;
}
}
</style>
</head>
<body>
<canvas id="canvas" aria-label="MEMI visual tracking animation"></canvas>
<div id="controls" aria-label="MEMI tracker controls">
<button type="button" data-pattern="set1">Set 1 · Horizon Sweeps</button>
<button type="button" data-pattern="set2">Set 2 · Standing Triangle</button>
<button type="button" data-pattern="set3">Set 3 · Figure 8</button>
<button type="button" data-pattern="set4">Set 4 · Shrinking / Sitting</button>
<button type="button" id="fullscreenBtn" class="secondary-btn">Full Screen</button>
<button type="button" id="installBtn" class="secondary-btn">Install App</button>
<button type="button" id="stopBtn" class="stop-btn">Stop / Reset</button>
</div>
<button type="button" id="controlsToggle" class="secondary-btn" aria-expanded="true">Hide Menu</button>
<div id="status" role="status" aria-live="polite">Ready. Select a set.</div>
<script>
'use strict';
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const statusText = document.getElementById('status');
const controls = document.getElementById('controls');
const controlsToggle = document.getElementById('controlsToggle');
const stopBtn = document.getElementById('stopBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const installBtn = document.getElementById('installBtn');
let animationId = null;
let startTime = 0;
let currentPattern = null;
let logicalWidth = 0;
let logicalHeight = 0;
let menuHidden = false;
let deferredInstallPrompt = null;
const dot = {
x: 0,
y: 0,
radius: 18,
color: '#00ff66'
};
function getViewportSize() {
const vv = window.visualViewport;
const width = vv ? vv.width : document.documentElement.clientWidth;
const height = vv ? vv.height : document.documentElement.clientHeight;
return {
width: Math.max(1, Math.round(width)),
height: Math.max(1, Math.round(height))
};
}
function resizeCanvas() {
const viewport = getViewportSize();
logicalWidth = viewport.width;
logicalHeight = viewport.height;
const dpr = Math.min(window.devicePixelRatio || 1, 3);
canvas.style.width = logicalWidth + 'px';
canvas.style.height = logicalHeight + 'px';
canvas.width = Math.round(logicalWidth * dpr);
canvas.height = Math.round(logicalHeight * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.fillStyle = '#121212';
ctx.fillRect(0, 0, logicalWidth, logicalHeight);
}
function clearCanvas() {
ctx.save();
ctx.setTransform(1, 0, 0, 1, 0, 0);
ctx.fillStyle = '#121212';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.restore();
}
function setMenuHidden(hidden) {
menuHidden = hidden;
controls.classList.toggle('is-hidden', hidden);
controlsToggle.textContent = hidden ? 'Show Menu' : 'Hide Menu';
controlsToggle.setAttribute('aria-expanded', String(!hidden));
}
function stopAnimation(updateStatus = true) {
if (animationId !== null) {
cancelAnimationFrame(animationId);
animationId = null;
}
currentPattern = null;
startTime = 0;
clearCanvas();
if (updateStatus) {
statusText.textContent = 'Ready. Select a set.';
}
}
function runPattern(pattern) {
stopAnimation(false);
currentPattern = pattern;
startTime = performance.now();
if (window.matchMedia('(max-width: 720px)').matches) {
setMenuHidden(true);
}
animationId = requestAnimationFrame(animate);
}
function drawReferenceCenter(W, H) {
ctx.fillStyle = 'rgba(255,255,255,0.10)';
ctx.beginPath();
ctx.arc(W / 2, H / 2, 3, 0, Math.PI * 2);
ctx.fill();
}
function drawTrackingDot() {
ctx.save();
ctx.shadowBlur = 25;
ctx.shadowColor = dot.color;
ctx.fillStyle = dot.color;
ctx.beginPath();
ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
}
function animate(now) {
if (!currentPattern) return;
const elapsed = (now - startTime) / 1000;
const W = logicalWidth;
const H = logicalHeight;
let active = true;
clearCanvas();
drawReferenceCenter(W, H);
if (currentPattern === 'set1') {
const sweepDuration = 1.8;
const totalSweeps = 15;
const totalTime = sweepDuration * totalSweeps;
if (elapsed < totalTime) {
dot.y = H * 0.18;
const progress = (elapsed / sweepDuration) % 2;
const factor = progress > 1 ? 2 - progress : progress;
dot.x = W * 0.15 + (W * 0.70) * factor;
statusText.textContent = `Running Set 1: Above Horizon Sweep (${Math.floor(elapsed / sweepDuration) + 1}/${totalSweeps})`;
} else {
active = false;
}
}
else if (currentPattern === 'set2') {
const horizonPasses = 3;
const horizonSec = 1.8;
const horizonTotal = horizonPasses * horizonSec;
if (elapsed < horizonTotal) {
dot.y = H * 0.18;
const progress = (elapsed / horizonSec) % 2;
const factor = progress > 1 ? 2 - progress : progress;
dot.x = W * 0.15 + (W * 0.70) * factor;
statusText.textContent = `Set 2 Phase 1: Horizon Sweeps (${Math.floor(elapsed / horizonSec) + 1}/${horizonPasses})`;
} else {
const triElapsed = elapsed - horizonTotal;
const triSec = 3.0;
const totalTri = 9;
if (triElapsed < totalTri * triSec) {
const triIdx = Math.floor(triElapsed / triSec);
const t = (triElapsed % triSec) / triSec;
const A = { x: W * 0.20, y: H * 0.20 };
const B = { x: W * 0.80, y: H * 0.20 };
const C = { x: W * 0.80, y: H * 0.80 };
const isReverse = triIdx >= 3 && triIdx < 6;
const currentT = isReverse ? (1 - t) : t;
const segment = currentT * 3;
if (segment < 1) {
dot.x = A.x + (B.x - A.x) * segment;
dot.y = A.y + (B.y - A.y) * segment;
} else if (segment < 2) {
dot.x = B.x + (C.x - B.x) * (segment - 1);
dot.y = B.y + (C.y - B.y) * (segment - 1);
} else {
dot.x = C.x + (A.x - C.x) * (segment - 2);
dot.y = C.y + (A.y - C.y) * (segment - 2);
}
statusText.textContent = `Set 2 Phase 2: Standing Triangle (Pass ${triIdx + 1}/9)${isReverse ? ' [REVERSED]' : ''}`;
} else {
active = false;
}
}
}
else if (currentPattern === 'set3') {
const f8Sec = 4.5;
const totalLoops = 4;
if (elapsed < totalLoops * f8Sec) {
const loopIdx = Math.floor(elapsed / f8Sec);
let t = ((elapsed % f8Sec) / f8Sec) * 2 * Math.PI;
const isReverse = loopIdx === 1 || loopIdx === 2;
if (isReverse) {
t = 2 * Math.PI - t;
}
dot.x = W * 0.50 + (W * 0.22) * Math.sin(2 * t);
dot.y = H * 0.50 + (H * 0.32) * Math.sin(t);
statusText.textContent = `Running Set 3: Figure 8 Sweep (Loop ${loopIdx + 1}/${totalLoops})${isReverse ? ' [REVERSED]' : ''}`;
} else {
active = false;
}
}
else if (currentPattern === 'set4') {
const circlePhaseSec = 10;
if (elapsed < circlePhaseSec) {
const progress = elapsed / circlePhaseSec;
const rotations = 6;
const angle = progress * rotations * 2 * Math.PI;
const maxRadius = Math.min(W, H) * 0.38;
const minRadius = Math.min(W, H) * 0.03;
const currentRadius = maxRadius - (maxRadius - minRadius) * progress;
dot.x = W * 0.50 + currentRadius * Math.cos(angle);
dot.y = H * 0.50 + currentRadius * Math.sin(angle);
statusText.textContent = 'Set 4 Phase 1: Shrinking Circles (Focus inward)';
} else {
const sitElapsed = elapsed - circlePhaseSec;
const triSec = 3.0;
const totalTri = 9;
if (sitElapsed < totalTri * triSec) {
const triIdx = Math.floor(sitElapsed / triSec);
const t = (sitElapsed % triSec) / triSec;
const A = { x: W * 0.20, y: H * 0.20 };
const B = { x: W * 0.80, y: H * 0.80 };
const C = { x: W * 0.20, y: H * 0.80 };
const isReverse = triIdx >= 3 && triIdx < 6;
const currentT = isReverse ? (1 - t) : t;
const segment = currentT * 3;
if (segment < 1) {
dot.x = A.x + (B.x - A.x) * segment;
dot.y = A.y + (B.y - A.y) * segment;
} else if (segment < 2) {
dot.x = B.x + (C.x - B.x) * (segment - 1);
dot.y = B.y + (C.y - B.y) * (segment - 1);
} else {
dot.x = C.x + (A.x - C.x) * (segment - 2);
dot.y = C.y + (A.y - C.y) * (segment - 2);
}
statusText.textContent = `Set 4 Phase 2: Sitting Triangle (Pass ${triIdx + 1}/9)${isReverse ? ' [REVERSED]' : ''}`;
} else {
active = false;
}
}
}
if (active) {
drawTrackingDot();
animationId = requestAnimationFrame(animate);
} else {
animationId = null;
currentPattern = null;
statusText.textContent = 'Sequence completed successfully.';
if (window.matchMedia('(max-width: 720px)').matches) {
setMenuHidden(false);
}
}
}
function isStandaloneMode() {
return window.matchMedia('(display-mode: standalone)').matches ||
window.navigator.standalone === true;
}
function isIOSDevice() {
return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function updateInstallButton() {
if (isStandaloneMode()) {
installBtn.hidden = true;
return;
}
installBtn.hidden = false;
installBtn.textContent = deferredInstallPrompt ? 'Install App' : (isIOSDevice() ? 'Install on iPhone/iPad' : 'Install App');
}
async function installApp() {
if (isStandaloneMode()) {
statusText.textContent = 'MEMI Tracker is already running as an installed app.';
return;
}
if (deferredInstallPrompt) {
deferredInstallPrompt.prompt();
const choice = await deferredInstallPrompt.userChoice;
deferredInstallPrompt = null;
statusText.textContent = choice.outcome === 'accepted'
? 'Install accepted. MEMI Tracker can now launch like an app.'
: 'Install canceled. You can install it later from this button or your browser menu.';
updateInstallButton();
return;
}
if (isIOSDevice()) {
statusText.textContent = 'On iPhone/iPad: open this page in Safari, tap Share, then choose Add to Home Screen.';
} else {
statusText.textContent = 'Use your browser menu and choose Install app, Add to Home Screen, or Add to Dock.';
}
}
async function toggleFullscreen() {
try {
if (document.fullscreenElement) {
await document.exitFullscreen();
return;
}
const root = document.documentElement;
if (root.requestFullscreen) {
await root.requestFullscreen();
} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else {
setMenuHidden(true);
statusText.textContent = 'Full-screen API is unavailable here. Menu hidden for maximum viewing area.';
}
} catch (err) {
setMenuHidden(true);
statusText.textContent = 'Could not enter browser full screen. Menu hidden instead.';
}
}
document.querySelectorAll('[data-pattern]').forEach((button) => {
button.addEventListener('click', () => runPattern(button.dataset.pattern));
});
stopBtn.addEventListener('click', () => {
stopAnimation(true);
setMenuHidden(false);
});
controlsToggle.addEventListener('click', () => {
setMenuHidden(!menuHidden);
});
fullscreenBtn.addEventListener('click', toggleFullscreen);
installBtn.addEventListener('click', installApp);
window.addEventListener('beforeinstallprompt', (event) => {
event.preventDefault();
deferredInstallPrompt = event;
updateInstallButton();
});
window.addEventListener('appinstalled', () => {
deferredInstallPrompt = null;
statusText.textContent = 'MEMI Tracker installed successfully.';
updateInstallButton();
});
document.addEventListener('fullscreenchange', resizeCanvas);
window.addEventListener('resize', resizeCanvas, { passive: true });
window.addEventListener('orientationchange', () => {
window.setTimeout(resizeCanvas, 100);
}, { passive: true });
if (window.visualViewport) {
window.visualViewport.addEventListener('resize', resizeCanvas, { passive: true });
window.visualViewport.addEventListener('scroll', resizeCanvas, { passive: true });
}
document.addEventListener('visibilitychange', () => {
if (document.hidden && currentPattern) {
stopAnimation(false);
statusText.textContent = 'Sequence stopped because the app/browser was moved to the background.';
setMenuHidden(false);
}
});
canvas.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });
updateInstallButton();
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('./service-worker.js').catch((error) => {
console.error('Service worker registration failed:', error);
});
});
}
resizeCanvas();
clearCanvas();
</script>
</body>
</html>
